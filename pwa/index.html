<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Assistant</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div id="transcript" class="transcript" aria-live="polite">
      <p class="hint">Hold the button and speak. Your words show here for you to
        fix before they reach the assistant.</p>
    </div>

    <!-- Editable transcript: the accent-correction step (AS-20). -->
    <textarea id="draft" class="draft" placeholder="Transcript will appear here..." hidden></textarea>

    <div class="controls">
      <button id="talk" class="talk">Hold to talk</button>
      <button id="send" class="send" hidden>Send</button>
    </div>
    <p id="status" class="status"></p>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
