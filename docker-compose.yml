# OpenClaw gateway (the "brain") for the personal assistant.
# Primary host: the always-on Windows PC. The Mac runs this SAME file only
# when it is the active backup brain (one brain at a time - see AS-3).
#
# Reach the Control UI/API from your phone over Tailscale, NOT by exposing a
# port. Keep it bound to localhost here and publish it to the tailnet with:
#   tailscale serve --bg 18789
# That way nothing is open on the LAN or the public internet.

services:
  openclaw:
    # Custom image = pinned OpenClaw base + openssh-client + the imsg-over-ssh
    # wrapper (see Dockerfile.imsg). Build/rebuild with: docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile.imsg
    image: assistant/openclaw:with-ssh
    container_name: openclaw
    restart: unless-stopped
    # Cap memory so a runaway brain process can't starve the other stacks
    # the Mac Docker VM also runs. Override with OPENCLAW_MEM_LIMIT if needed.
    mem_limit: ${OPENCLAW_MEM_LIMIT:-3g}
    env_file:
      - .env
    ports:
      # localhost only - Tailscale Serve publishes it privately to the tailnet.
      - "127.0.0.1:18789:18789"
    volumes:
      # Config (openclaw.json), state DB, agent profiles, and the Markdown
      # workspace all live here. This host dir is what Syncthing mirrors to the
      # Mac (see config/openclaw-home.stignore for what to exclude).
      - ./data/openclaw:/home/node/.openclaw
      # Auth-profile secret encryption key - keep on the host, never in git.
      - ./data/openclaw-secret:/home/node/.config/openclaw
      # imsg-over-SSH key + known_hosts. Linux-native named volume so the key stays
      # 600 (ssh refuses the 0777 that a Windows bind mount would show). Read-only.
      - openclaw_imsg_ssh:/home/node/.ssh-imsg:ro
      # Separate launch key for the Mac "start Claude Code session" gate (never the
      # imsg key). Same named-volume trick to keep the private key at 600. Read-only.
      - openclaw_launch_ssh:/home/node/.ssh-launch:ro
      # Launch triggers: Brice drops an allowlisted project name file here; the Windows
      # host watcher (scripts/warp-launch-watcher.ps1) opens a visible Warp + claude.
      - ./data/launch-triggers:/home/node/.launch-triggers
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN

volumes:
  # Create + populate once (per host): docker volume create openclaw_imsg_ssh, then
  # copy id_ed25519 (chmod 600) and known_hosts in, owned by uid 1000.
  openclaw_imsg_ssh:
    external: true
  # Create + populate once: docker volume create openclaw_launch_ssh, then add the
  # brice-launch key (chmod 600) and known_hosts, owned by uid 1000.
  openclaw_launch_ssh:
    external: true

# First run (after adding keys to .env):
#   docker compose up -d
#   docker compose exec openclaw openclaw onboard
